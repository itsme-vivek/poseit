    <!-- Eyes peering over top of glasses -->
    <circle cx="90" cy="58" r="3" fill="#FF5722"/>
    <circle cx="110" cy="58" r="3" fill="#FF5722"/>
    <!-- Hand gently touching glasses frame -->
    <path d="M 120,105 C 135,90 138,75 125,70"/>
    <path d="M 80,105 L 75,235 M 120,105 L 122,235"/>
    <path d="M 75,235 L 78,350 M 122,235 L 118,350"/>

