<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 400">
  <defs>
    <marker id="arrow" markerWidth="6" markerHeight="4" refX="6" refY="2" orient="auto">
      <polygon points="0 0, 6 2, 0 4" fill="#FF5722"/>
    </marker>
  </defs>
  <g fill="none" stroke="#FF6D00" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="4,4">
    <!-- 0.5x Ultra-Wide Distorted Top-Down Selfie -->
    <!-- Large head close to top lens -->
    <ellipse cx="100" cy="70" rx="38" ry="32"/>
    <!-- Distorted wide eyes & cool expression -->
    <path d="M 85,65 Q 90,60 95,65 M 105,65 Q 110,60 115,65"/>
    <path d="M 92,85 Q 100,92 108,85"/>
    <!-- Oversized sunglasses sitting on nose -->
    <rect x="76" y="58" width="22" height="14" rx="4" stroke="#FF5722" stroke-width="1.8"/>
    <rect x="102" y="58" width="22" height="14" rx="4" stroke="#FF5722" stroke-width="1.8"/>
    <line x1="98" y1="65" x2="102" y2="65"/>
    <!-- Arm extending up towards phone camera -->
    <path d="M 75,98 C 50,60 35,30 30,15"/>
    <!-- Tapering small body pointing down -->
    <path d="M 82,100 L 78,210 M 118,100 L 122,210"/>
    <path d="M 78,210 L 85,340 M 122,210 L 115,340"/>
    <!-- Top-down perspective arrow -->
    <line x1="160" y1="35" x2="125" y2="60" stroke="#FF5722" stroke-width="2" marker-end="url(#arrow)"/>

  </g>
</svg>
