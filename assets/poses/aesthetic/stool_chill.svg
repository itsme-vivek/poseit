<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 450">
  <g fill="none" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <!-- Stool Ledge -->
    <line x1="85" y1="285" x2="225" y2="285" stroke="#78909C" stroke-width="1.8" stroke-dasharray="4,4"/>

    <!-- Head Tilted Left (~15°) & Soft Wavy Bob -->
    <path d="M 184,62 C 178,45 194,36 210,40 C 226,44 235,58 232,76"/>
    <path d="M 184,62 C 190,55 204,54 212,60 C 220,56 228,62 232,76"/>
    <path d="M 178,70 C 172,82 170,98 174,112"/>
    <path d="M 232,76 C 238,90 236,108 230,122"/>

    <!-- Face Contour (Tilted) -->
    <path d="M 186,78 C 182,90 186,106 196,114 C 206,116 216,108 222,96 C 224,88 222,80 218,76"/>
    <!-- Features -->
    <circle cx="196" cy="85" r="2" fill="#FFFFFF"/>
    <circle cx="214" cy="87" r="2" fill="#FFFFFF"/>
    <path d="M 205,88 L 206,96 L 203,98"/>
    <path d="M 198,105 C 204,107 210,107 214,104"/>

    <!-- Left Hand Supporting Jaw/Ear (arm bent up from stool) -->
    <path d="M 218,96 C 224,102 228,110 226,120"/> <!-- Fingers at jawline -->
    <path d="M 226,120 L 222,148"/> <!-- Wrist & watch -->
    <rect x="219" y="132" width="7" height="4" rx="1" stroke="#FFFFFF" fill="#FFFFFF"/> <!-- Watch detail -->
    <path d="M 222,148 C 220,185 224,220 234,250"/> <!-- Forearm / upper arm -->

    <!-- Oversized Tee (Tucked into belted pants) -->
    <path d="M 188,118 C 170,125 156,135 146,150"/> <!-- Right shoulder -->
    <path d="M 146,150 C 142,175 144,198 150,215"/> <!-- Right sleeve cuff -->
    <path d="M 216,118 C 226,125 240,135 248,150"/> <!-- Left shoulder -->
    <path d="M 248,150 C 252,175 250,198 244,215"/> <!-- Left sleeve cuff -->

    <path d="M 160,190 C 178,198 210,198 228,190"/> <!-- Tee folds -->
    <path d="M 166,224 C 182,228 206,228 222,224"/> <!-- Tucked waist -->

    <!-- Belt & High-Waisted Pants -->
    <rect x="188" y="222" width="12" height="7" rx="1" stroke="#FFFFFF"/> <!-- Belt buckle -->
    <line x1="165" y1="225" x2="223" y2="225" stroke-width="2.5"/> <!-- Belt strap -->

    <!-- Right Arm resting loosely on lap -->
    <path d="M 150,215 C 152,235 158,255 168,272"/>
    <path d="M 168,272 C 172,278 178,284 184,286"/> <!-- Hand on thigh -->

    <!-- Seated Baggy Trousers & Legs -->
    <path d="M 165,228 C 152,248 144,275 146,305 C 148,340 150,380 152,410"/> <!-- Right outer leg -->
    <path d="M 182,286 C 182,320 180,360 178,410"/> <!-- Right inner leg -->
    <path d="M 152,410 L 178,410"/> <!-- Cuff -->

    <path d="M 223,228 C 235,248 242,275 238,305 C 234,340 228,380 224,410"/> <!-- Left outer leg -->
    <path d="M 200,286 C 204,320 206,360 206,410"/> <!-- Left inner leg -->
    <path d="M 206,410 L 224,410"/> <!-- Cuff -->

    <!-- Pants wrinkle folds -->
    <path d="M 154,260 C 168,266 182,266 190,260"/>
    <path d="M 150,330 C 162,335 174,335 178,330"/>
    <path d="M 208,330 C 218,335 228,335 234,330"/>
  </g>
