<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 400">
  <defs>
    <marker id="arrow" markerWidth="6" markerHeight="4" refX="6" refY="2" orient="auto">
      <polygon points="0 0, 6 2, 0 4" fill="#FF5722"/>
    </marker>
  </defs>
  <g fill="none" stroke="#42A5F5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="4,4">
    <!-- Railing line -->
    <line x1="25" y1="180" x2="175" y2="180" stroke="#78909C" stroke-width="2.5"/>
    <!-- Head looking forward -->
    <path d="M 86,52 C 80,38 108,36 115,48 C 122,58 118,75 110,85 C 102,94 92,94 86,84 Z"/>
    <!-- Forearms resting on railing -->
    <path d="M 78,105 C 60,130 55,160 52,180 L 80,180"/>
    <path d="M 118,105 C 135,130 140,160 144,180 L 116,180"/>
    <!-- Torso leaning forward -->
    <path d="M 72,110 L 68,235 M 124,110 L 122,235"/>
    <!-- Legs straight -->
    <path d="M 68,235 L 72,345 L 86,345 L 94,250"/>
    <path d="M 122,235 L 118,345 L 104,345 L 98,250"/>

  </g>
</svg>
