<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <!-- Clean Hand-Drawn Sketch of Models on Couch (Posing Guide Cover Style) -->
  <g fill="none" stroke="#2C3437" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    
    <!-- Couch outline in background -->
    <path d="M 60 170 C 60 140, 80 130, 110 130 L 290 130 C 320 130, 340 140, 340 170" stroke-width="1.8" stroke="#8E99A2" stroke-dasharray="3,3" />
    <path d="M 50 180 L 350 180" stroke-width="2" stroke="#78909C" />
    <path d="M 70 180 L 60 260 L 340 260 L 330 180" stroke-width="2" stroke="#B0BEC5" />
    
    <!-- Left Couple: Hug from Behind -->
    <!-- Boy Behind -->
    <circle cx="105" cy="85" r="22" />
    <!-- Hair -->
    <path d="M 90 75 C 95 62, 120 62, 126 76 C 122 70, 105 68, 92 78" fill="#2C3437" />
    <!-- Eyes & Smile -->
    <path d="M 98 83 Q 102 85 106 83" />
    <path d="M 112 83 Q 116 85 120 83" />
    <path d="M 104 94 Q 110 98 116 94" />
    <!-- Boy Shoulders & Arms wrapping around girl -->
    <path d="M 85 105 C 70 120, 60 160, 60 185" />
    <path d="M 125 105 C 135 115, 145 135, 140 160" />
    <!-- Left Arm -->
    <path d="M 60 185 C 70 195, 95 185, 110 175" />
    <!-- Girl in Front -->
    <circle cx="130" cy="115" r="20" />
    <!-- Girl Long Hair -->
    <path d="M 115 105 C 110 130, 105 160, 110 180" />
    <path d="M 142 105 C 150 125, 155 160, 150 190" />
    <path d="M 118 102 C 125 95, 140 95, 146 104" fill="#2C3437" />
    <!-- Girl Eyes & Smile -->
    <path d="M 124 114 Q 127 116 130 114" />
    <path d="M 136 114 Q 139 116 142 114" />
    <path d="M 128 123 Q 133 126 138 123" />
    <!-- Girl Body and Hands resting on boy's arms -->
    <path d="M 120 135 C 110 160, 110 190, 115 220" />
    <path d="M 140 135 C 150 160, 150 190, 145 220" />
    <path d="M 115 165 C 125 170, 135 170, 145 165" />
    <path d="M 120 175 Q 130 178 140 175" />

    <!-- Center Model: Elegant Seated Graceful Lean -->
    <!-- Head -->
    <circle cx="205" cy="75" r="22" />
    <!-- High Bun Hair -->
    <circle cx="205" cy="50" r="12" fill="#2C3437" />
    <path d="M 188 68 C 195 58, 218 58, 222 70" />
    <!-- Eyes, nose, gentle confident smile -->
    <path d="M 197 73 Q 200 75 203 73" />
    <path d="M 209 73 Q 212 75 215 73" />
    <path d="M 205 77 L 204 81" />
    <path d="M 200 86 Q 205 89 210 86" />
    <!-- Slender Neck & Collarbone -->
    <path d="M 201 97 L 201 106" />
    <path d="M 209 97 L 209 106" />
    <path d="M 190 108 Q 205 112 220 108" />
    <!-- Off-shoulder elegant top -->
    <path d="M 180 112 C 170 130, 165 170, 175 190" />
    <path d="M 230 112 C 240 130, 245 170, 235 190" />
    <!-- Left Hand Resting on Arm of Chair -->
    <path d="M 175 125 C 160 145, 155 175, 160 200" />
    <!-- Right Arm Angled Confident -->
    <path d="M 230 120 C 245 140, 250 165, 240 195" />
    <!-- Dress / Legs crossed seated -->
    <path d="M 175 190 C 185 220, 185 250, 190 275" />
    <path d="M 225 190 C 215 220, 210 250, 205 275" />
    <!-- Crossed Foot -->
    <path d="M 190 275 C 195 285, 210 285, 215 275" />
    <path d="M 205 275 C 210 282, 225 282, 228 273" />

    <!-- Right Couple / Friends Group -->
    <!-- Boy Leaning Forward -->
    <circle cx="285" cy="115" r="21" />
    <!-- Hair -->
    <path d="M 270 105 C 275 95, 298 95, 302 108" fill="#2C3437" />
    <!-- Eyes & Big Grin -->
    <path d="M 277 113 Q 281 115 285 113" />
    <path d="M 290 113 Q 294 115 298 113" />
    <path d="M 280 124 Q 287 130 295 124" />
    <!-- Arms crossed on back of couch -->
    <path d="M 265 135 C 255 155, 255 185, 275 195" />
    <path d="M 305 135 C 315 155, 315 185, 295 195" />
    <path d="M 270 190 L 305 190" />
    <!-- Girl Behind smiling over shoulder -->
    <circle cx="315" cy="85" r="19" />
    <path d="M 300 78 C 308 68, 328 70, 332 82" />
    <path d="M 325 80 C 335 95, 340 120, 338 140" />
    <path d="M 308 83 Q 312 85 315 83" />
    <path d="M 320 83 Q 323 85 326 83" />
    <path d="M 312 93 Q 317 96 322 93" />
    <path d="M 325 105 C 335 120, 340 145, 335 165" />
    <path d="M 305 105 C 300 115, 295 130, 298 145" />

    <!-- Cute Camera Icon in corner -->
    <g transform="translate(325, 20) scale(0.7)">
      <rect x="0" y="8" width="40" height="28" rx="6" stroke="#00BCD4" stroke-width="2.5" />
      <path d="M 12 8 L 16 2 L 24 2 L 28 8 Z" stroke="#00BCD4" stroke-width="2" fill="#E0F7FA" />
      <circle cx="20" cy="22" r="7" stroke="#00BCD4" stroke-width="2.5" />
      <circle cx="32" cy="14" r="2" fill="#FF5252" stroke="none" />
    </g>
  </g>
</svg>
