    <!-- Head & Jawline (tilted up, looking down with confidence) -->
    <path d="M 128,150 C 128,172 136,192 152,202 C 168,206 186,196 196,176 C 200,165 200,150 196,140"/>

    <!-- Confident Eyes looking down at lens -->
    <!-- Left Eye & Brow -->
    <path d="M 136,140 C 142,136 148,137 154,142"/> <!-- Brow -->
    <path d="M 138,146 C 144,144 150,146 154,149"/> <!-- Upper lid -->
    <ellipse cx="146" cy="148" rx="2.5" ry="1.8" fill="#FFFFFF"/>
    <!-- Right Eye & Brow -->
    <path d="M 168,142 C 174,137 180,136 186,140"/> <!-- Brow -->
    <path d="M 168,149 C 172,146 178,144 184,146"/> <!-- Upper lid -->
    <ellipse cx="176" cy="148" rx="2.5" ry="1.8" fill="#FFFFFF"/>

    <!-- Upturned Refined Nose -->
    <path d="M 162,148 L 163,165 L 158,168"/>

    <!-- Full Lips with Attitude -->
    <path d="M 152,180 C 158,177 166,177 172,180"/>
    <path d="M 154,182 C 160,186 164,186 170,182"/>

    <!-- Neck with delicate shadow lines -->
    <path d="M 146,204 L 140,240"/>
    <path d="M 176,204 L 184,240"/>
    <path d="M 152,225 C 160,230 166,230 172,225" stroke-dasharray="2,2"/> <!-- Collarbone shadow -->

    <!-- Oversized Crewneck T-Shirt Collar & Drop Shoulders -->
