    <path d="M 186,240 C 210,246 234,260 252,285 L 262,360"/> <!-- Left dropped shoulder & sleeve -->

    <!-- Shirt folds across chest -->
    <path d="M 115,295 C 140,312 182,312 208,295"/>
    <path d="M 130,340 C 150,355 172,355 192,340"/>
